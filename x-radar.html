<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美股 X 情报雷达</title>
<style>
:root{--bg:#080c11;--card:#101820;--line:#263640;--text:#edf5f8;--muted:#8497a3;--blue:#62adff;--cyan:#65e8dc;--green:#2ddd9c;--amber:#ffb84d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;padding:16px 20px;background:#080c11f2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.top h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#121b23;color:var(--text)}
.wrap{max-width:1500px;margin:auto;padding:16px}.notice{padding:11px 13px;border:1px solid #3a4b55;border-radius:10px;background:#0d151c;color:#a9bbc5;line-height:1.6;margin-bottom:14px}.notice strong{color:var(--cyan)}
.toolbar{display:grid;grid-template-columns:minmax(210px,1.1fr) minmax(220px,1.3fr) 180px auto;gap:9px;margin-bottom:12px}input,select,button{min-height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#111a22;color:var(--text);font:inherit}button{cursor:pointer}.toggle.active{border-color:var(--amber);color:#ffd58c}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mode{border-color:#30414c}.mode.active{border-color:var(--cyan);color:#bafff5;background:#10272a}
.stats{display:flex;gap:14px;align-items:center;color:var(--muted);margin:6px 2px 12px}.stats b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#111a22,#0d141b);transition:.15s}.card:hover{border-color:#46606f;transform:translateY(-1px)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.ticker{font-size:18px;font-weight:900}.group{font-size:10px;padding:3px 6px;border-radius:999px;background:#192a35;color:#aac2cf}.star{border:0;background:transparent;color:#5f7380;font-size:20px;min-height:auto;padding:0}.star.on{color:#ffc04d}.desc{height:34px;margin:9px 0;color:var(--muted);font-size:12px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr auto;gap:7px}.open{display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px;background:#e8eef2;color:#071015;font-weight:850}.all{display:flex;align-items:center;justify-content:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#b9cbd4}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
footer{padding:24px 16px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){header{position:static}.top{display:block}.nav{margin-top:10px}.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.toolbar,.grid{grid-template-columns:1fr}.modes{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="top"><div><h1>𝕏 美股情报雷达 · 零成本版</h1><div class="sub">基于现有 Hyperliquid 美股雷达标的，一键筛选 X 最新信息</div></div><nav class="nav"><a href="./">🇺🇸 美股雷达</a><a href="crypto.html">₿ 加密雷达</a></nav></div></header>
<main class="wrap">
<div class="notice"><strong>使用方式：</strong>选择情报类型后点击标的“打开最新”，将在新标签页进入 X 的实时搜索。此版本不调用付费 API，不在网页内抓取或保存推文；X 可能要求登录。</div>
<section class="toolbar"><input id="search" placeholder="搜索代码，如 NVDA / CRCL"><input id="extra" placeholder="附加关键词，如 FDA / earnings / contract"><select id="sector"><option value="all">全部行业</option><option value="ai">AI / 半导体</option><option value="mega">大型科技</option><option value="crypto">加密相关</option><option value="biotech">医药生物</option><option value="finance">金融</option><option value="energy">能源工业</option><option value="consumer">消费</option><option value="etf">ETF</option><option value="other">其他</option></select><button id="favOnly" class="toggle">☆ 只看自选</button></section>
<section id="modes" class="modes"></section><div class="stats">显示 <b id="shown">0</b> 个标的 · 已收藏 <b id="favCount">0</b> 个</div><section id="grid" class="grid"></section>
</main>
<footer>零成本检索工具，仅用于信息收集。推文可能包含传言、广告或错误信息，交易前请核对公司公告与监管文件。</footer>
<script>
const TICKERS=`AAPL ABBV ABNB AMD AMGN AMZN ARM AVGO BA BABA BAC BE BIDU BMY BRK.B CAT CCL CMCSA COIN COHR COST CRM CRCL CSCO CVX DELL DIS ETN F GEV GFS GME GOOG GOOGL GS HD HIMS HOOD HPE IBM INTC JNJ JPM LITE LLY MA MARA MCD META MRK MRNA MRVL MSFT MSTR MU NFLX NKE NVDA OKLO ORCL PANW PEP PFE PLTR PYPL QCOM QQQ RDDT RIOT RKLB SBUX SMCI SNDK SOFI SPY STX TGT TSM TSLA UBER UNH V VRT WDC WMT XOM AAOI AMAT NET NCLD KORU SOXL`.split(/\s+/);
const SETS={ai:`AMD ARM AVGO COHR DELL GFS HPE IBM INTC LITE MRVL MU NVDA ORCL PANW QCOM SMCI SNDK STX TSM VRT WDC AAOI AMAT NET`.split(" "),mega:`AAPL AMZN CRM GOOG GOOGL META MSFT NFLX ORCL TSLA`.split(" "),crypto:`COIN CRCL HOOD MARA MSTR RIOT`.split(" "),biotech:`ABBV AMGN BMY HIMS JNJ LLY MRK MRNA PFE UNH`.split(" "),finance:`BAC BRK.B GS JPM MA PYPL SOFI V`.split(" "),energy:`BA BE CAT CVX ETN F GEV OKLO RKLB XOM`.split(" "),consumer:`ABNB BABA BIDU CCL CMCSA COST DIS GME HD MCD NKE PEP RDDT SBUX TGT UBER WMT`.split(" "),etf:`QQQ SPY KORU SOXL`.split(" ")};
const MODES={official:{label:"🏢 公司官方公告",desc:"财报、指引、投资者关系及监管文件",terms:'(official OR earnings OR guidance OR "investor relations" OR filing OR "8-K" OR "10-Q") -filter:replies'},breaking:{label:"⚡ 突发新闻与利好",desc:"突发、订单、合作、获批、业绩超预期",terms:'(breaking OR "breaking news" OR beats OR contract OR approval OR partnership OR raises guidance)'},analyst:{label:"🎯 分析师观点",desc:"评级、目标价、上调与下调",terms:'(analyst OR "price target" OR upgrade OR downgrade OR overweight OR outperform)'},extended:{label:"🌙 盘前盘后异动",desc:"盘前、盘后、跳空与异常成交",terms:'(premarket OR "pre-market" OR "after hours" OR afterhours OR gap OR "unusual volume")'}};
const $=s=>document.querySelector(s);let mode="breaking",favOnly=false;const favorites=new Set(JSON.parse(localStorage.getItem("xRadarFavorites")||"[]"));
function sectorOf(t){for(const [k,a] of Object.entries(SETS))if(a.includes(t))return k;return"other"}function sectorName(k){return({ai:"AI/半导体",mega:"大型科技",crypto:"加密相关",biotech:"医药生物",finance:"金融",energy:"能源工业",consumer:"消费",etf:"ETF",other:"其他"})[k]}
function cashTag(t){return"$"+t}function query(t,m=mode){const extra=$("#extra").value.trim();return `${cashTag(t)} ${MODES[m].terms}${extra?" "+extra:""} lang:en`}function xUrl(t,m=mode){return"https://x.com/search?q="+encodeURIComponent(query(t,m))+"&src=typed_query&f=live"}function allUrl(t){return"https://x.com/search?q="+encodeURIComponent(cashTag(t)+" lang:en")+"&src=typed_query&f=live"}
function save(){localStorage.setItem("xRadarFavorites",JSON.stringify([...favorites]))}function toggleFav(t){favorites.has(t)?favorites.delete(t):favorites.add(t);save();render()}
function renderModes(){$("#modes").innerHTML=Object.entries(MODES).map(([k,v])=>`<button class="mode ${k===mode?"active":""}" data-mode="${k}">${v.label}</button>`).join("");document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderModes();render()})}
function render(){const q=$("#search").value.trim().toUpperCase(),sector=$("#sector").value;const list=TICKERS.filter(t=>(!q||t.includes(q))&&(sector==="all"||sectorOf(t)===sector)&&(!favOnly||favorites.has(t)));$("#shown").textContent=list.length;$("#favCount").textContent=favorites.size;$("#favOnly").classList.toggle("active",favOnly);$("#favOnly").textContent=(favOnly?"★":"☆")+" 只看自选";$("#grid").innerHTML=list.length?list.map(t=>{const s=sectorOf(t);return`<article class="card"><div class="card-top"><div><span class="ticker">${t}</span> <span class="group">${sectorName(s)}</span></div><button class="star ${favorites.has(t)?"on":""}" data-star="${t}" title="收藏">★</button></div><div class="desc">${MODES[mode].desc}${$("#extra").value.trim()?" · +自定义关键词":""}</div><div class="actions"><a class="open" href="${xUrl(t)}" target="_blank" rel="noopener noreferrer">打开最新</a><a class="all" href="${allUrl(t)}" target="_blank" rel="noopener noreferrer">全部</a></div></article>`}).join(""):'<div class="empty">没有符合条件的标的</div>';document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.star))}
$("#search").oninput=render;$("#extra").oninput=render;$("#sector").onchange=render;$("#favOnly").onclick=()=>{favOnly=!favOnly;render()};renderModes();render();
</script>
</body></html>
