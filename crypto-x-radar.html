<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>加密货币 X 情报雷达</title>
  <meta name="description" content="基于 Hyperliquid 主永续合约的一键 X 最新情报检索工具">
  <style>
    :root{--bg:#080c11;--card:#101820;--line:#263640;--text:#edf5f8;--muted:#8497a3;--cyan:#65e8dc;--green:#2ddd9c;--amber:#ffb84d;--red:#ff6678}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#10332f 0,#080c11 34%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:5;padding:16px 20px;background:#080c11f2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.top h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#121b23}
    .wrap{max-width:1500px;margin:auto;padding:16px}.notice{padding:11px 13px;border:1px solid #3a4b55;border-radius:10px;background:#0d151c;color:#a9bbc5;line-height:1.6;margin-bottom:14px}.notice strong{color:var(--cyan)}
    .toolbar{display:grid;grid-template-columns:minmax(210px,1.1fr) minmax(220px,1.3fr) 180px auto;gap:9px;margin-bottom:12px}input,select,button{min-height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#111a22;color:var(--text);font:inherit}button{cursor:pointer}.toggle.active{border-color:var(--amber);color:#ffd58c}
    .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mode{border-color:#30414c}.mode.active{border-color:var(--cyan);color:#bafff5;background:#10272a}
    .stats{display:flex;gap:14px;align-items:center;color:var(--muted);margin:6px 2px 12px;flex-wrap:wrap}.stats b{color:var(--text)}.live{color:var(--green)}.warn{color:var(--amber)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#111a22,#0d141b);transition:.15s}.card:hover{border-color:#46606f;transform:translateY(-1px)}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.ticker{font-size:18px;font-weight:900}.group{font-size:10px;padding:3px 6px;border-radius:999px;background:#192a35;color:#aac2cf}.star{border:0;background:transparent;color:#5f7380;font-size:20px;min-height:auto;padding:0}.star.on{color:#ffc04d}.desc{height:34px;margin:9px 0;color:var(--muted);font-size:12px;line-height:1.45}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:9px}.up{color:var(--green)}.dn{color:var(--red)}
    .actions{display:grid;grid-template-columns:1fr auto auto;gap:7px}.open{display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px;background:#e8eef2;color:#071015;font-weight:850}.secondary{display:flex;align-items:center;justify-content:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#b9cbd4}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}
    footer{padding:24px 16px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){header{position:static}.top{display:block}.nav{margin-top:10px}.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.toolbar,.grid{grid-template-columns:1fr}.modes{display:grid;grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr auto}}
  </style>
</head>
<body>
  <header><div class="top"><div><h1>𝕏 加密货币情报雷达 · 零成本版</h1><div class="sub">自动读取 Hyperliquid 主永续合约，一键筛选 X 最新信息</div></div><nav class="nav"><a href="crypto.html">₿ 加密雷达</a><a href="./">🇺🇸 美股雷达</a><a href="x-radar.html">𝕏 美股情报</a></nav></div></header>
  <main class="wrap">
    <div class="notice"><strong>使用方式：</strong>选择情报类型后点击币种“打开最新”，将在新标签页进入 X 实时搜索；“K线”直达 Hyperliquid。此版本不调用付费 X API，不在网页内抓取或保存推文，X 可能要求登录。</div>
    <section class="toolbar"><input id="search" placeholder="搜索币种，如 BTC / HYPE / SOL"><input id="extra" placeholder="附加关键词，如 ETF / listing / unlock"><select id="sector"><option value="all">全部赛道</option><option value="major">主流币</option><option value="l1">公链 / L2</option><option value="defi">DeFi</option><option value="ai">AI</option><option value="meme">Meme</option><option value="rwa">RWA</option><option value="gaming">游戏</option><option value="other">其他</option></select><button id="favOnly" class="toggle">☆ 只看自选</button></section>
    <section id="modes" class="modes"></section><div class="stats"><span>显示 <b id="shown">0</b> 个币种</span><span>已收藏 <b id="favCount">0</b> 个</span><span id="sourceStatus" class="warn">正在连接 Hyperliquid…</span></div><section id="grid" class="grid"></section>
  </main>
  <footer>零成本检索工具，仅用于信息收集。X 内容可能包含传言、广告或错误信息，交易前请核对项目官方渠道、交易所公告与链上数据。</footer>
  <script>
    const API="https://api.hyperliquid.xyz/info";
    const FALLBACK=`BTC ETH SOL HYPE XRP BNB DOGE ADA AVAX LINK SUI LTC BCH DOT NEAR APT ARB OP INJ ATOM TAO UNI AAVE ENA ONDO TRX TON WIF PEPE BONK PUMP FARTCOIN CRV LDO JUP SEI TIA FIL ICP RUNE MKR PENDLE`.split(/\s+/);
    const SETS={major:`BTC ETH SOL HYPE XRP BNB DOGE ADA LTC BCH TRX TON`.split(" "),l1:`SOL SUI AVAX ADA DOT NEAR APT ATOM SEI TIA FIL ICP TON TRX`.split(" "),defi:`UNI AAVE ENA CRV LDO JUP RUNE MKR PENDLE INJ`.split(" "),ai:`TAO FET RENDER RNDR VIRTUAL WLD AI16Z`.split(" "),meme:`DOGE WIF PEPE BONK PUMP FARTCOIN SHIB FLOKI TRUMP POPCAT`.split(" "),rwa:`ONDO OM POLYX CFG PENDLE`.split(" "),gaming:`IMX GALA SAND MANA AXS BEAM PIXEL`.split(" ")};
    const ALIAS={BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",HYPE:"Hyperliquid",XRP:"Ripple",BNB:"Binance",DOGE:"Dogecoin",ADA:"Cardano",AVAX:"Avalanche",LINK:"Chainlink",SUI:"Sui",TAO:"Bittensor",ONDO:"Ondo Finance",ENA:"Ethena",PUMP:"Pump.fun",WIF:"dogwifhat",PEPE:"Pepe"};
    const MODES={official:{label:"🏢 项目官方公告",desc:"升级、路线图、治理、代币经济与官方发布",terms:'(official OR announcement OR update OR upgrade OR roadmap OR governance OR tokenomics) -filter:replies'},breaking:{label:"⚡ 突发新闻与利好",desc:"上币、合作、ETF、融资、产品发布与监管进展",terms:'(breaking OR listing OR partnership OR ETF OR funding OR launch OR approval OR adoption)'},analyst:{label:"🎯 分析师观点",desc:"研究、观点、目标位、看多与看空逻辑",terms:'(analyst OR research OR outlook OR target OR bullish OR bearish OR thesis)'},flow:{label:"🐋 异动与链上资金",desc:"鲸鱼、聪明钱、清算、资金流与异常成交",terms:'(whale OR smartmoney OR "smart money" OR inflow OR outflow OR liquidation OR "unusual volume" OR onchain OR "on-chain")'}};
    const $=s=>document.querySelector(s);let mode="breaking",favOnly=false,coins=[];const favorites=new Set(JSON.parse(localStorage.getItem("cryptoXRadarFavorites")||"[]"));
    function sectorOf(t){for(const [k,a] of Object.entries(SETS))if(a.includes(t))return k;return"other"}function sectorName(k){return({major:"主流币",l1:"公链/L2",defi:"DeFi",ai:"AI",meme:"Meme",rwa:"RWA",gaming:"游戏",other:"其他"})[k]}
    function pct(x){return Number.isFinite(x)?(x>=0?"+":"")+x.toFixed(2)+"%":"—"}function money(x){if(!Number.isFinite(x))return"—";if(x>=1e9)return"$"+(x/1e9).toFixed(1)+"B";if(x>=1e6)return"$"+(x/1e6).toFixed(1)+"M";return"$"+Math.round(x).toLocaleString()}
    function baseQuery(t){return `$${t}${ALIAS[t]?` OR "${ALIAS[t]}"`:""}`}function query(t,m=mode){const extra=$("#extra").value.trim();return `(${baseQuery(t)}) ${MODES[m].terms}${extra?" "+extra:""} lang:en`}function xUrl(t,m=mode){return"https://x.com/search?q="+encodeURIComponent(query(t,m))+"&src=typed_query&f=live"}function allUrl(t){return"https://x.com/search?q="+encodeURIComponent(`(${baseQuery(t)}) lang:en`)+"&src=typed_query&f=live"}function chartUrl(t){return"https://app.hyperliquid.xyz/trade/"+encodeURIComponent(t)}
    function save(){localStorage.setItem("cryptoXRadarFavorites",JSON.stringify([...favorites]))}function toggleFav(t){favorites.has(t)?favorites.delete(t):favorites.add(t);save();render()}
    function renderModes(){$("#modes").innerHTML=Object.entries(MODES).map(([k,v])=>`<button class="mode ${k===mode?"active":""}" data-mode="${k}">${v.label}</button>`).join("");document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderModes();render()})}
    function render(){const q=$("#search").value.trim().toUpperCase(),sector=$("#sector").value;const list=coins.filter(x=>(!q||x.ticker.includes(q))&&(sector==="all"||sectorOf(x.ticker)===sector)&&(!favOnly||favorites.has(x.ticker)));$("#shown").textContent=list.length;$("#favCount").textContent=favorites.size;$("#favOnly").classList.toggle("active",favOnly);$("#favOnly").textContent=(favOnly?"★":"☆")+" 只看自选";$("#grid").innerHTML=list.length?list.map(x=>{const t=x.ticker,s=sectorOf(t);return`<article class="card"><div class="card-top"><div><span class="ticker">${t}</span> <span class="group">${sectorName(s)}</span></div><button class="star ${favorites.has(t)?"on":""}" data-star="${t}" title="收藏">★</button></div><div class="desc">${MODES[mode].desc}${$("#extra").value.trim()?" · +自定义关键词":""}</div><div class="meta"><span class="${x.d1>=0?"up":"dn"}">24h ${pct(x.d1)}</span><span>成交额 ${money(x.vol)}</span></div><div class="actions"><a class="open" href="${xUrl(t)}" target="_blank" rel="noopener noreferrer">打开最新</a><a class="secondary" href="${chartUrl(t)}" target="_blank" rel="noopener noreferrer">K线</a><a class="secondary" href="${allUrl(t)}" target="_blank" rel="noopener noreferrer">全部</a></div></article>`}).join(""):'<div class="empty">没有符合条件的币种</div>';document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.star))}
    async function load(){try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type:"metaAndAssetCtxs"})});if(!r.ok)throw Error("HTTP "+r.status);const [meta,ctx=[]]=await r.json();coins=(meta?.universe||[]).map((u,i)=>{const c=ctx[i]||{},mid=+(c.midPx||c.markPx),prev=+c.prevDayPx;return{ticker:String(u.name||"").toUpperCase(),vol:+c.dayNtlVlm||0,d1:prev>0?(mid/prev-1)*100:NaN}}).filter(x=>x.ticker).sort((a,b)=>b.vol-a.vol);$("#sourceStatus").className="live";$("#sourceStatus").textContent=`● Hyperliquid 实时币种 ${coins.length} 个`;}catch(e){coins=FALLBACK.map(t=>({ticker:t,vol:NaN,d1:NaN}));$("#sourceStatus").className="warn";$("#sourceStatus").textContent="使用备用币种列表";}render()}
    $("#search").oninput=render;$("#extra").oninput=render;$("#sector").onchange=render;$("#favOnly").onclick=()=>{favOnly=!favOnly;render()};renderModes();load();
  </script>
</body>
</html>
